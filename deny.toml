[licenses]
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Unicode-3.0", "Zlib", "0BSD", "MPL-2.0", "CC0-1.0", "OpenSSL", "Unlicense", "CDLA-Permissive-2.0",
]

[advisories]
yanked = "deny"
# These standalone crates were folded into zbus 6, not reported vulnerable.
# keyring 4.2's Linux backend still requires zbus 5. zbus 6 needs Rust 1.89,
# which is now Rail's minimum too, so only the keyring migration is left.
# Remove these when it lands, or when phase 6 of docs/design/pimdir-port.md
# drops keyring. Keep vulnerability and other advisory checks.
ignore = [
  { id = "RUSTSEC-2026-0370", reason = "zvariant: transitive keyring dependency; migration requires zbus 6" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names: transitive keyring dependency; migration requires zbus 6" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: transitive keyring dependency; migration requires zbus 6" },
]

[bans]
multiple-versions = "allow"

[sources]
# io-pimdir is pinned to the git rev neverest and himalaya pin (see Cargo.toml); no other git
# sources are allowed.
unknown-git = "deny"
allow-git = ["https://github.com/pimalaya/io-pimdir"]
